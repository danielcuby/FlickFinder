<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlickFinder — find where to watch anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="poster-wall" id="poster-wall" aria-hidden="true"></div>
  <div class="backdrop-overlay" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <h1>FlickFinder</h1>
      <p class="tagline">Type a movie or show. See where it's streaming, and where in the world.</p>
      <form id="search-form" autocomplete="off">
        <input id="search-input" type="text" placeholder="Search a title…" />
      </form>
      <ul id="suggestions" class="suggestions hidden"></ul>
    </section>

    <section id="trending" class="trending">
      <h2>Popular today</h2>
      <div class="trending-grid" id="trending-grid"></div>
    </section>

    <section id="result" class="result hidden"></section>
  </main>

  <footer class="attribution">
    Streaming data from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>
    and <a href="https://www.justwatch.com/" target="_blank" rel="noopener">JustWatch</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
