<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlickFinder — find where to watch anything</title>
<meta name="description" content="Search any movie or TV show and instantly see which streaming platforms have it and in which countries, plus rent or buy options and VPN access for titles not available in your region." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-20MC2W1HRH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-20MC2W1HRH');
</script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9432544499416179"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="poster-wall" id="poster-wall" aria-hidden="true"></div>
  <div class="backdrop-overlay" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <h1 id="logo" class="logo">
        <svg class="logo-icon" viewBox="0 0 100 100" width="40" height="40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="42" cy="42" r="24" fill="none" stroke="currentColor" stroke-width="8"/>
          <line x1="59" y1="59" x2="80" y2="80" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
          <path class="logo-play" d="M33 28 L33 56 L57 42 Z"/>
        </svg>
        FlickFinder
      </h1>
      <p class="tagline">Type a movie or show. See where it's streaming, and where in the world.</p>
      <form id="search-form" autocomplete="off">
        <input id="search-input" type="text" placeholder="Search a title…" />
      </form>
      <ul id="suggestions" class="suggestions hidden"></ul>
    </section>

    <section id="trending" class="trending">
      <h2>Popular today</h2>
      <div class="trending-wrap">
        <button type="button" class="trending-arrow trending-arrow-left" id="trending-prev" aria-label="Scroll left">‹</button>
        <div class="trending-grid" id="trending-grid"></div>
        <button type="button" class="trending-arrow trending-arrow-right" id="trending-next" aria-label="Scroll right">›</button>
      </div>
    </section>

    <section id="result" class="result hidden"></section>
  </main>

  <footer class="attribution">
    Streaming data from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>
    and <a href="https://www.justwatch.com/" target="_blank" rel="noopener">JustWatch</a>.
  </footer>

  <div class="contact-us" id="contact-us">
    <div class="contact-us-title">Contact us</div>

    <a class="contact-row" href="https://www.instagram.com/flickfindernet/" target="_blank" rel="noopener">
      <svg class="contact-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/>
      </svg>
      <span>@flickfindernet</span>
    </a>

    <a class="contact-row" href="https://www.tiktok.com/@flickfindernet?_r=1&_t=ZS-99ywLtLcYnl" target="_blank" rel="noopener">
      <svg class="contact-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="9" cy="17" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 17V4.5l7 2v3l-7-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>@flickfindernet</span>
    </a>

    <a class="contact-row" href="https://www.youtube.com/@flickfinder-net" target="_blank" rel="noopener">
      <svg class="contact-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10 8.5 L16 12 L10 15.5 Z" fill="currentColor"/>
      </svg>
      <span>@flickfinder-net</span>
    </a>

    <a class="contact-row" href="mailto:flickfindernet@gmail.com">
      <svg class="contact-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>flickfindernet@gmail.com</span>
    </a>
  </div>

  <div class="vpn-sticky" id="vpn-sticky"></div>

  <div class="vpn-modal-overlay" id="vpn-modal-overlay">
    <div class="vpn-modal">
      <button type="button" class="vpn-modal-close" id="vpn-modal-close" aria-label="Close">✕</button>
      <div class="vpn-modal-content" id="vpn-modal-content"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
